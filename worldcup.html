<title>WK 2026 Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@300;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; max-width: 100%; overflow: hidden; }
  body { background: #121212; font-family: 'DM Sans', sans-serif; color: #fff; }


  .widget {
    width: 100%; max-width: 100%;
    height: 175px;
    padding: 10px 10px 10px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    position: relative; overflow: hidden;
  }


  .bg-layer {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transition: opacity 1.4s ease-in-out; opacity: 0;
  }
  .bg-layer.active { opacity: 1; }

  .bg-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      90deg,
      rgba(0,0,0,0.86) 0%,
      rgba(0,0,0,0.68) 50%,
      rgba(0,0,0,0.80) 100%
    );
    pointer-events: none;
  }


  .widget-inner {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    height: 100%;
  }


  .widget-header {
    display: flex; justify-content: flex-end;
    margin-bottom: 6px;
  }
  .date-chip {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px; font-weight: 500;
    color: rgba(255,255,255,0.75);
    background: rgba(255,255,255,0.11);
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 999px; padding: 2px 9px;
    letter-spacing: 0.04em; white-space: nowrap;
  }


  .match-list {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center;
  }
  .match-list.page-out {
    opacity: 0; transform: translateY(5px);
    transition: opacity 0.32s ease, transform 0.32s ease;
  }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .match-list.page-in { animation: pageIn 0.36s ease forwards; }


  .page-dots {
    display: flex; justify-content: center; gap: 5px;
    height: 14px; align-items: center; margin-top: 4px;
  }
  .page-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255,255,255,0.28);
    transition: background 0.3s, transform 0.3s;
  }
  .page-dot.active {
    background: rgba(255,255,255,0.85); transform: scale(1.4);
  }


  .match-row {
    display: grid;
    grid-template-columns: 40px 1px 1fr;
    align-items: center;
    column-gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    position: relative;
  }
  .match-row:last-child { border-bottom: none; }


  .live-dot {
    position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
    width: 5px; height: 5px; border-radius: 50%;
    background: #ff4444; animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }


  .col-time-city {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  }
  .row-time {
    font-family: 'Outfit', sans-serif; font-weight: 700;
    font-size: 15px; line-height: 1; color: #fff;
    letter-spacing: -0.2px; white-space: nowrap;
  }
  .match-row.live .row-time { color: #ff9090; }
  .row-city {
    font-size: 9.5px; color: rgba(255,255,255,0.45); white-space: nowrap;
  }


  .row-divider {
    width: 1px; height: 22px;
    background: rgba(255,255,255,0.15); justify-self: center;
  }


  .row-teams {
    display: flex; align-items: center; gap: 5px; min-width: 0;
  }
  .team-side {
    display: flex; align-items: center; gap: 5px; flex: 1 1 0; min-width: 0;
  }
  .team-side.right { justify-content: flex-end; }

  .flag-wrap {
    flex-shrink: 0; width: 20px; height: 14px;
    border-radius: 2px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.55);
    background: rgba(255,255,255,0.08);
  }
  .flag-wrap img { width: 20px; height: 14px; object-fit: cover; display: block; }
  .flag-wrap.no-flag { visibility: hidden; }

  .team-name {
    font-family: 'Outfit', sans-serif; font-weight: 600;
    font-size: 15px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  }


  .score-sep {
    flex-shrink: 0; min-width: 22px; text-align: center;
    font-family: 'Outfit', sans-serif; font-weight: 300;
    font-size: 15px; color: rgba(255,255,255,0.40);
  }


  .no-match-row {
    padding: 10px 0;
    font-size: 11px; color: rgba(255,255,255,0.55);
  }


  .glow-wrap { border-radius: 20px; }
</style>
</head>

let photoIdx       = 0;
let allMatches     = [];
let currentPage    = 0;
let pageTimer      = null;

function getNL() {
  if (DATE_SIM) {
    if (DATE_SIM.includes('T')) {
      const [dp, tp] = DATE_SIM.split('T');
      const [y,m,d]  = dp.split('-').map(Number);
      const [h,mi]   = tp.split(':').map(Number);
      return new Date(y, m-1, d, h, mi, 0);
    } else {
      const [y,m,d] = DATE_SIM.split('-').map(Number);
      return new Date(y, m-1, d, 15, 0, 0);
    }
  }
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Amsterdam' }));
}

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function shiftDate(dateStr, days) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d+days);
  return toDateStr(dt);
}

function getWindowStart() {
  const nl = getNL();
  if (nl.getHours() < 7) nl.setDate(nl.getDate() - 1);
  return toDateStr(nl);
}

function getWindowMatches() {
  const start = getWindowStart();
  const end   = shiftDate(start, 1);
  return SCHEDULE
    .filter(([, date, time]) =>
      (date === start && time >= '07:00') ||
      (date === end   && time <  '07:00')
    )
    .sort((a, b) => {
      const aIsEnd = a[1] === end;
      const bIsEnd = b[1] === end;
      if (aIsEnd !== bIsEnd) return aIsEnd ? 1 : -1;
      return a[2].localeCompare(b[2]);
    });
}

function isLive(date, time) {
  const nl  = getNL();
  const [y,m,d] = date.split('-').map(Number);
  const [h,mi]  = time.split(':').map(Number);
  const kick = new Date(y, m-1, d, h, mi);
  const diff = (nl - kick) / 60000;
  return diff >= 0 && diff < 110;
}

function formatChipDate(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString(t.locale, {
    weekday: 'short', day: 'numeric', month: 'short'
  });
}

const NL_UTC_H = 2;

function matchToUTC(nlDate, nlTime) {
  const [y,m,d] = nlDate.split('-').map(Number);
  const [h,mi]  = nlTime.split(':').map(Number);
  return Date.UTC(y, m-1, d, h - NL_UTC_H, mi);
}

function displayTime(nlDate, nlTime) {
  if (TZ === 'Europe/Amsterdam') return nlTime;
  const utcMs = matchToUTC(nlDate, nlTime);
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false
  }).format(new Date(utcMs)).replace(/^24:/, '00:');
}

function swapPhoto(url) {
  const inn = currentBg === 'A' ? bgB : bgA;
  const out = currentBg === 'A' ? bgA : bgB;
  const img = new Image();
  img.onload = () => {
    inn.style.backgroundImage = `url(${url})`;
    inn.classList.add('active');
    out.classList.remove('active');
    currentBg = currentBg === 'A' ? 'B' : 'A';
  };
  img.src = url;
}

function nextPhoto() {
  if (NO_BG) return;
  swapPhoto(FOOTBALL_PHOTOS[photoIdx % FOOTBALL_PHOTOS.length]);
  photoIdx++;
}

function makeFlagWrap(teamName) {
  const wrap = document.createElement('div');
  wrap.className = 'flag-wrap';
  const code = FLAG_CODES[teamName];
  if (code) {
    const img = document.createElement('img');
    img.src = `${FLAG_BASE}${code}.png`;
    img.alt = teamName;
    wrap.appendChild(img);
  } else {
    wrap.classList.add('no-flag');
  }
  return wrap;
}

const CITY_SHORT = {
  'Mexico City':'MEX','Guadalajara':'GDL','Los Angeles':'LAX',
  'San Francisco':'SFO','New York/NJ':'NYC','Vancouver':'VAN',
  'Toronto':'TOR','Boston':'BOS','Houston':'HOU','Dallas':'DAL',
  'Miami':'MIA','Seattle':'SEA','Atlanta':'ATL','Philadelphia':'PHI',
  'Kansas City':'K.C.','Monterrey':'MTY',
};

function makeRow(match) {
  const [num, date, time, t1, t2, round, city] = match;
  const live = isLive(date, time);

  const row = document.createElement('div');
  row.className = 'match-row' + (live ? ' live' : '');

  if (live) {
    const dot = document.createElement('div');
    dot.className = 'live-dot';
    row.appendChild(dot);
  }

  const timeCityEl = document.createElement('div');
  timeCityEl.className = 'col-time-city';
  const timeEl = document.createElement('div');
  timeEl.className = 'row-time';
  timeEl.textContent = displayTime(date, time);
  const cityEl = document.createElement('div');
  cityEl.className = 'row-city';
  cityEl.textContent = CITY_SHORT[city] || city.slice(0, 4);
  timeCityEl.appendChild(timeEl);
  timeCityEl.appendChild(cityEl);
  row.appendChild(timeCityEl);

  const divEl = document.createElement('div');
  divEl.className = 'row-divider';
  row.appendChild(divEl);

  const teamsEl = document.createElement('div');
  teamsEl.className = 'row-teams';

  const leftEl = document.createElement('div');
  leftEl.className = 'team-side left';
  leftEl.appendChild(makeFlagWrap(t1));
  const n1 = document.createElement('span');
  n1.className = 'team-name'; n1.textContent = translateTeam(t1);
  leftEl.appendChild(n1);

  const vsEl = document.createElement('div');
  vsEl.className = 'score-sep';
  vsEl.textContent = '–';

  const rightEl = document.createElement('div');
  rightEl.className = 'team-side right';
  const n2 = document.createElement('span');
  n2.className = 'team-name'; n2.textContent = translateTeam(t2);
  rightEl.appendChild(n2);
  rightEl.appendChild(makeFlagWrap(t2));

  teamsEl.appendChild(leftEl);
  teamsEl.appendChild(vsEl);
  teamsEl.appendChild(rightEl);
  row.appendChild(teamsEl);

  return row;
}

function renderPage(animate) {
  const totalPages = Math.ceil(allMatches.length / PAGE_SIZE);
  const page = allMatches.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);

  const paint = () => {
    matchListEl.innerHTML = '';
    page.forEach(m => matchListEl.appendChild(makeRow(m)));
    pageDotsEl.innerHTML = '';
    if (totalPages > 1) {
      for (let i = 0; i < totalPages; i++) {
        const d = document.createElement('div');
        d.className = 'page-dot' + (i === currentPage ? ' active' : '');
        pageDotsEl.appendChild(d);
      }
    }
    if (animate) {
      matchListEl.classList.add('page-in');
      setTimeout(() => matchListEl.classList.remove('page-in'), 400);
    }
  };

  if (animate) {
    matchListEl.classList.add('page-out');
    setTimeout(() => { matchListEl.classList.remove('page-out'); paint(); }, 330);
  } else {
    paint();
  }
}

function startPaging() {
  clearInterval(pageTimer);
  currentPage = 0;
  renderPage(false);
  if (allMatches.length > PAGE_SIZE) {
    const totalPages = Math.ceil(allMatches.length / PAGE_SIZE);
    pageTimer = setInterval(() => {
      currentPage = (currentPage + 1) % totalPages;
      renderPage(true);
    }, 6000);
  }
}

function getNextDayMatches() {
  const start = getWindowStart();
  const end   = shiftDate(start, 1);
  const first = SCHEDULE.find(([, d, tm]) =>
    d > end || (d === end && tm >= '12:00')
  );
  if (!first) return { date: null, matches: [] };
  const ns  = first[2] >= '12:00' ? first[1] : shiftDate(first[1], -1);
  const ne  = shiftDate(ns, 1);
  return {
    date: ns,
    matches: SCHEDULE
      .filter(([, d, tm]) => (d === ns && tm >= '12:00') || (d === ne && tm < '12:00'))
      .sort((a, b) => {
        const aE = a[1] === ne, bE = b[1] === ne;
        if (aE !== bE) return aE ? 1 : -1;
        return a[2].localeCompare(b[2]);
      }),
  };
}

function renderList() {
  const matches = getWindowMatches();
  const start   = getWindowStart();

  clearInterval(pageTimer);
  pageDotsEl.innerHTML = '';

  if (matches.length) {
    dateChipEl.textContent = formatChipDate(start);
    allMatches = matches;
  } else {
    const { date, matches: nextMatches } = getNextDayMatches();
    if (date) {
      dateChipEl.textContent = formatChipDate(date);
      allMatches = nextMatches;
    } else {
      dateChipEl.textContent = '';
      allMatches = [];
      matchListEl.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'no-match-row';
      empty.textContent = t.noMore;
      matchListEl.appendChild(empty);
      return;
    }
  }
  startPaging();
}

function render() {
  nextPhoto();
  renderList();
}

render();
setInterval(nextPhoto, 20000);
if (!DATE_SIM) setInterval(render, 30 * 60 * 1000);

})();
</script>
